# natural-ai-query-editor — local PostgreSQL for development
#
#   Start:            docker compose up -d
#   Status / logs:    docker compose ps        docker compose logs -f postgres
#   psql shell:       docker compose exec postgres psql -U postgres -d shopdb
#   Stop (keep data): docker compose stop
#   Reset all data:   docker compose down -v   (next app start re-creates schema + sample data)
#   Optional pgAdmin: docker compose --profile tools up -d   → http://localhost:5050
#
# The container starts an EMPTY database "shopdb". The tables, sample data and
# mcp_app role are created by mcp-sql-server on its first start (Flyway V1–V3).

name: natural-ai-query-editor

services:
  postgres:
    image: postgres:16-alpine
    container_name: naqe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: shopdb
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"     # only reachable from this machine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d shopdb"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: naqe-pgadmin
    profiles: ["tools"]                        # only starts with --profile tools
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
