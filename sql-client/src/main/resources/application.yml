server:
  port: 8080

spring:
  security:
    user:
      name: ${APP_USERNAME}
      password: ${APP_PASSWORD}
  ai:
    openai:
      api-key: ${OPENROUTER_API_KEY}
      base-url: ${LLM_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        model: ${LLM_MODEL}          # never hard-code model names in Java
        temperature: 0.0
        timeout: 60s
        max-retries: 1               # free endpoints are rate limited, so fail fast
    mcp:
      client:
        enabled: false               # McpClientConfig builds connections; the LLM must never see MCP tools

app:
  mcp:
    url: ${MCP_SERVER_URL:http://localhost:8081}
    api-key: ${MCP_API_KEY}
    connect-timeout: 10s
    request-timeout: 60s
  preview:
    secret: ${PREVIEW_TOKEN_SECRET}
    ttl: 5m
